groups:
  - name: medora
    rules:
      - alert: MedoraAuditDlqOpen
        expr: medora_audit_dlq_open_failures > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Audit DLQ has open failures"
      - alert: MedoraHttpErrorRateHigh
        expr: medora_http_error_rate_5m > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP error rate > 5% over 5m"
      - alert: MedoraHighLatencyP95
        expr: medora_http_latency_ms{quantile="0.95"} > 800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 800ms"
