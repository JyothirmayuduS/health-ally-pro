groups:
  - name: medora
    rules:
      - alert: MedoraAuditDlqOpen
        expr: medora_audit_dlq_open_failures >= 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Audit DLQ has open failures"
          description: "open_failures={{ $value }}"

      - alert: MedoraAppointmentsLatencyWarn
        expr: medora_resource_latency_ms{resource="appointments",quantile="0.95"} > 400
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Appointments p95 above warn threshold (400ms)"

      - alert: MedoraAppointmentsLatencyCritical
        expr: medora_resource_latency_ms{resource="appointments",quantile="0.95"} > 800
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Appointments p95 above critical threshold (800ms)"

      - alert: MedoraAppDown
        expr: up{job="medora-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Medora Prometheus target is down"

      - alert: MedoraAuthAnomaly
        expr: increase(medora_auth_failures_total[5m]) > 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Elevated authentication failures in 5m window"
